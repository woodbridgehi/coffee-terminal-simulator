<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../assets/brand.css">
<style>
.owrap{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:clamp(20px,4.5vh,48px) clamp(24px,4.5vw,76px);z-index:1}
.bg{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%}
.ohead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding-bottom:clamp(8px,1.6vh,14px);border-bottom:1px solid var(--line-dark)}
.oindex{font-family:var(--font-mono);font-size:clamp(10px,1.1vw,13px);letter-spacing:.2em;color:var(--cream-muted)}
.obody{display:flex;flex-direction:column;justify-content:center;min-height:0;padding:clamp(10px,2vh,20px) 0}
.otitle{font-family:var(--font-display);font-weight:600;margin:0;color:var(--cream-fg);
  font-size:clamp(30px,5.1vw,66px);line-height:1.25;letter-spacing:.06em;max-width:22em}
.ocursor{margin:clamp(12px,2.6vh,26px) 0}
.olead{margin:0 0 clamp(14px,3vh,30px);font-size:clamp(13px,1.6vw,20px);line-height:1.8;color:var(--cream-muted);max-width:40em}
.omenu{list-style:none;margin:0;padding:0;max-width:56em}
.omenu li{display:grid;grid-template-columns:4ch minmax(0,1fr) auto;align-items:baseline;gap:clamp(10px,2vw,24px);
  padding:clamp(6px,1.4vh,13px) 0;border-top:1px solid var(--line-dark)}
.omenu li:last-child{border-bottom:1px solid var(--line-dark)}
.omenu i{font-family:var(--font-mono);font-style:normal;font-size:clamp(10px,1.15vw,14px);letter-spacing:.12em;color:var(--cream-muted)}
.omenu b{font-family:var(--font-display);font-weight:600;font-size:clamp(14px,2vw,24px);letter-spacing:.1em;color:var(--cream-fg)}
.omenu em{font-family:var(--font-mono);font-style:normal;font-size:clamp(9px,1.05vw,13px);letter-spacing:.14em;color:var(--cream-muted);text-transform:uppercase}
.ofoot{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding-top:clamp(8px,1.5vh,13px);border-top:1px solid var(--line-dark)}
/* 页面底色绑定品牌令牌：深色底 1「森林绿」--forest (#123D31)，不使用体系外绿色 */
body.dark{background:var(--forest)}
/* 黄铜层挖空底衬：与底色同令牌，保证条纹间隙始终是森林绿 */
.ko{fill:var(--forest)}
/* 黄铜蚀刻层：默认强度与石景山页一致（--brass 是唯一强度旋钮） */
.bg{--brass:.33}
.bg .bLayer{opacity:var(--brass)}
/* 浅色肌理与黄铜层在小内容区自动降噪，保护小字号对比度 */
@media (max-width:1240px){.bg .tex{opacity:.62}}
@media (max-width:900px){.bg .tex{opacity:.5}.bg{--brass:.24}}
@media (max-width:760px){.bg .tex{opacity:.42}.bg{--brass:.2}}
@media (max-width:560px){.bg{--brass:.13}}
@media (max-aspect-ratio:4/5){
  .bg .tex{opacity:.5}.bg{--brass:.19}
  .otitle{font-size:clamp(28px,7.6vw,48px)}
  .omenu b{font-size:clamp(13px,3.8vw,18px)}
  .omenu li{padding:6px 0}
  .olead{font-size:clamp(12px,3.4vw,15px);margin-bottom:10px}
}
</style><link rel="stylesheet" href="../assets/terminal-fit.css"></head>
