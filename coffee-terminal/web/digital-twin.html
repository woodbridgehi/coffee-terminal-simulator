<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>咖啡工作台 · 数字孪生</title><link rel="icon" type="image/svg+xml" href="assets/brand/logo-symbol.svg"><link rel="stylesheet" href="digital-twin.css"></head><body>
<header><div><span class="eyebrow">COFFEE / DIGITAL TWIN</span><h1>工作台仿真实验室</h1></div><div class="badge">本地仿真 · 参数待实机标定</div></header>
<main><section class="workspace"><div class="toolbar"><button id="play" disabled>开始</button><button id="step" disabled>单步</button><button id="reset" disabled>重置</button><label>速度 <select id="speed"><option value="1">1×</option><option value="4">4×</option><option value="16">16×</option></select></label><label>视角 <select id="view"><option value="shop">门店全景</option><option value="workcell">工作台</option><option value="top">俯视</option></select></label><label><input type="checkbox" id="labels" checked>工位</label><label><input type="checkbox" id="collision">碰撞几何</label><span id="clock">0.00 s</span></div><div id="viewport"></div><div class="statusline"><strong id="status">正在加载仿真内核…</strong><span id="progress">0 / 25</span></div><div class="timeline"><div class="sectionline"><h2>任务时间线</h2><span>蓝：左臂　金：右臂　绿：设备</span></div><div id="gantt"></div></div></section>
<aside><section><h2>设备与物料</h2><div id="devices"></div><div id="materials"></div><div id="containers"></div></section><section><h2>实验控制</h2><label>调度策略 <select id="policy"><option value="parallel">双臂并行</option><option value="serial">任务串行</option></select></label><div class="buttonrow"><button id="compare" disabled>比较两种策略</button><button id="export" disabled>导出实验</button></div><p id="comparison">同一场景、同一配方，比较完工时间与资源利用率。</p><label>设备 <select id="fault-device"><option value="brewer">咖啡机</option><option value="foamer">奶沫机</option><option value="hot-water">热水机</option></select></label><div class="buttonrow"><button id="fault" disabled>注入故障</button><button id="repair" disabled>维修复位</button></div><button id="refill" disabled>补充牛奶 1 kg</button></section><section><h2>场景与回放</h2><label class="file">导入场景 JSON<input id="world-file" type="file" accept=".json"></label><label class="file">导入实验回放<input id="replay-file" type="file" accept=".json"></label><label>回放位置<input id="seek" type="range" min="0" max="0" value="0" disabled></label><p>场景采用米、弧度、秒、千克。修改设备布局或运动参数后重新运行。</p></section><section><h2>事件日志</h2><pre id="events" aria-live="polite"></pre></section></aside></main>
<footer>品牌门店 · 工艺仿真 · 装饰模型不参与碰撞 · UR10e 标称 DH · Rapier 碰撞查询 · 固定步长 20 ms · 无流体求解　<a href="robot-scene.html">原展示场景 ↗</a></footer><script type="module" src="digital-twin.bundle.js"></script></body></html>
