<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="onboarding.title">Coffee Terminal · 设备配对</title>
  <link rel="icon" href="assets/brand/monogram-ct.svg" />
  <link rel="stylesheet" href="onboarding.css?v=20260914-setup" />
  <link rel="stylesheet" href="brand-system.css?v=20260911-qarm">
  <link rel="stylesheet" href="window-chrome.css?v=20260914-windows">
</head>
<body>
  <main class="shell">
    <aside class="brand">
      <div class="brand-lockup"><img src="assets/brand/logo-badge.svg" alt="" /><span>COFFEE TERMINAL</span></div>
      <h1 data-i18n="onboarding.heading">设备首次配对</h1>
      <ol class="steps" id="steps">
        <li class="step current" data-step="1"><span class="step-dot">1</span><span><b data-i18n="onboarding.identity">软件身份</b></span></li>
        <li class="step" data-step="2"><span class="step-dot">2</span><span><b data-i18n="onboarding.merchant">商户配对</b></span></li>
        <li class="step" data-step="3"><span class="step-dot">3</span><span><b data-i18n="onboarding.provision">自动接入</b></span></li>
      </ol>
      <div class="brand-badge-rotator" id="brandBadgeRotator" aria-hidden="true">
        <img class="brand-art current" src="assets/brand/badges/ai-brew-system.svg" alt="" />
        <img class="brand-art" src="assets/brand/badges/precision-brew-cream.svg" alt="" hidden />
      </div>
      <div class="onboarding-powered"><span>Powered by</span><img src="assets/brand/qarm/qarm-symbol-cream.svg" alt="" aria-hidden="true"><b data-i18n="onboarding.poweredBy">千臂机器人</b></div>
    </aside>
    <section class="content">
      <header class="content-head">
  <label class="locale-control" for="localeSelect"><span data-i18n="language.label">语言</span><select id="localeSelect"><option value="zh-CN">简体中文</option><option value="en-US">English</option></select></label>
        <div class="connection" id="connection"><span></span><span></span></div>
        <p class="eyebrow" id="stepEyebrow">STEP 1 / 3</p>
        <h2 id="stepTitle">连接设备</h2>
        <p class="desc" id="stepDesc"></p>
      </header>
      <div class="form-scroll">
        <section class="card welcome-panel" id="welcomePanel">
          <img src="assets/brand/marks/terminal.svg" alt="" aria-hidden="true">
          <h3 data-i18n="onboarding.welcome">连接您的门店</h3>
          <p data-i18n="onboarding.welcomeHint">获取配对码后，在商户后台添加此设备。</p>
        </section>
        <section class="success-panel" id="successPanel" hidden>
          <div class="success-icon">✓</div><h2 data-i18n="onboarding.successTitle">设备已完成配对</h2>
          <p data-i18n="onboarding.successDesc">正式 HTTP 与 MQTT 凭证已安全写入本地。关闭此窗口后重新启动，即可进入咖啡终端。</p>
          <div class="success-meta"><div><small>DEVICE ID</small><b id="sumDeviceId">—</b></div><div><small data-i18n="onboarding.serial">模拟器 SN</small><b id="sumSerial">—</b></div><div><small data-i18n="onboarding.deviceName">设备名称</small><b id="sumDeviceName">—</b></div><div><small data-i18n="onboarding.store">所属门店</small><b id="sumStoreName">—</b></div></div>
        </section>
        <section class="card pairing-card" id="pairingPanel" hidden>
          <div class="identity-grid">
            <div><small data-i18n="onboarding.factorySerial">模拟器出厂序列号</small><b id="serialNumber">—</b></div>
            <div><small data-i18n="onboarding.cloudId">云端设备 ID</small><b id="deviceId">—</b></div>
          </div>
          <div class="pairing-code-wrap">
            <small data-i18n="onboarding.pairingCode.help">请在商户后台「我的设备 → 配对新设备」输入以下配对码</small>
            <strong id="pairingCode">—</strong>
            <span id="expiresAt">—</span>
          </div>
          <div class="pairing-status" id="pairingStatus"><i></i><div><b data-i18n="onboarding.status.waiting">等待商户确认</b><p data-i18n="onboarding.status.waitingDesc">商户确认门店和设备名称后，本机将自动领取正式凭证。</p></div></div>
        </section>
      </div>
      <footer class="wizard-foot">
        <p id="error" role="alert"></p>
        <div><span id="footNote"></span><button id="retryBtn" class="btn primary" type="button" disabled data-i18n="onboarding.retry">重新生成配对码</button><button id="refreshBtn" class="btn ghost" type="button" hidden disabled data-i18n="onboarding.refresh">刷新配对状态</button></div>
      </footer>
    </section>
  </main>
  <script src="i18n.js?v=20260904-i18n1"></script>
  <script src="locales.js?v=20260914-setup"></script>
  <script src="onboarding.js?v=20260914-badge-sequence"></script>
  <script src="window-chrome.js?v=20260914-windows"></script>
</body>
</html>
